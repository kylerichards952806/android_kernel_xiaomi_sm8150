name: Build kernel (SM8150 / vayu)

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Defconfig fragment set'
        required: false
        default: 'vayu'
        type: choice
        options:
          - vayu
          - sm8150-common
  push:
    branches:
      - MI_SM8150_5.4
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The kernel Makefile does `CC = $(CROSS_COMPILE)gcc`, and a plain Makefile
  # assignment beats an environment variable, so the toolchain has to be
  # passed as a make *argument* ($(MAKE_ARGS)), not exported here.
  MAKE_ARGS: >-
    ARCH=arm64
    CC=clang-18
    LD=ld.lld-18
    AR=llvm-ar-18
    NM=llvm-nm-18
    OBJCOPY=llvm-objcopy-18
    OBJDUMP=llvm-objdump-18
    STRIP=llvm-strip-18
    READELF=llvm-readelf-18
    CROSS_COMPILE=aarch64-linux-gnu-
    CLANG_TRIPLE=aarch64-linux-gnu-
  KBUILD_BUILD_USER: duckyduck
  KBUILD_BUILD_HOST: metonator.dev

jobs:
  build:
    name: arm64 ${{ inputs.config || 'vayu' }}
    # ubuntu-24.04 ships LLVM 18. LLVM 14's ld.lld cannot resolve the ABS32
    # relocations that CONFIG_MODVERSIONS emits for the __crc_* symbols, which
    # fails only at the final vmlinux link.
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Add swap (LTO needs headroom on 16 GB runners)
        run: |
          # Best effort: LTO_CLANG can be memory hungry. Never fail the job here.
          if ! sudo swapon --show | grep -q '/'; then
            sudo dd if=/dev/zero of=/swapfile2 bs=1M count=8192 status=none || true
            sudo chmod 600 /swapfile2 || true
            sudo mkswap /swapfile2 || true
            sudo swapon /swapfile2 || true
          fi
          free -h

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio rsync libssl-dev libelf-dev \
            python3 make gcc \
            clang-18 lld-18 llvm-18 \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          # The CFI/LTO link step shells out to unversioned llvm-nm/llvm-objcopy
          # rather than $(NM)/$(OBJCOPY), so the versioned binaries alone are
          # not enough.
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump \
                   llvm-readelf llvm-strip llvm-size llvm-symbolizer llvm-cov \
                   llvm-profdata llvm-as llvm-link llvm-config opt llc; do
            if [ -e "/usr/bin/$t-18" ]; then
              sudo ln -sf "/usr/bin/$t-18" "/usr/local/bin/$t"
            fi
          done
          echo "--- versions ---"
          clang-18 --version | head -2
          ld.lld-18 --version
          llvm-nm --version | head -1
          aarch64-linux-gnu-ld --version | head -1

      - name: Configure
        run: |
          set -eu
          # kbuild's %.config rule merges each fragment onto the .config that
          # already exists (scripts/kconfig/merge_config.sh -m .config ...),
          # so the base defconfig must be generated first and each fragment
          # applied in its own `make` invocation. This is exactly the order
          # TARGET_KERNEL_CONFIG uses in BoardConfigCommon.mk.
          make O=out $MAKE_ARGS vendor/sm8150-qgki_defconfig
          make O=out $MAKE_ARGS vendor/xiaomi/sm8150-common.config
          make O=out $MAKE_ARGS vendor/xiaomi/${{ inputs.config || 'vayu' }}.config

          echo "--- key config values ---"
          grep -E '^CONFIG_(LOCALVERSION|ARCH_QCOM|RPS|I2C)=' out/.config
          grep -q '^CONFIG_ARCH_QCOM=y' out/.config \
            || { echo '::error::ARCH_QCOM not enabled; the defconfig base was lost'; exit 1; }

          # The tree sets CONFIG_CC_WERROR=y and was built by the vendor with
          # clang 22. Several pre-existing constructs in vendor code warn under
          # clang-14 (mm/slub.c %zu/%pS, kernel/sched/walt/walt.c %llu). They
          # are not in code this repo touches, so downgrade warnings to
          # warnings; real compile errors still fail the build.
          scripts/config --file out/.config -d CC_WERROR
          # Drop stale generated config so the next make cannot inherit the
          # previous CONFIG_CC_WERROR=y through include/config/auto.conf.
          rm -f out/include/config/auto.conf out/include/config/auto.conf.cmd \
                out/include/generated/autoconf.h
          make O=out $MAKE_ARGS olddefconfig
          grep -E '^# CONFIG_CC_WERROR is not set' out/.config \
            || { echo '::error::CC_WERROR still enabled'; exit 1; }

      - name: Build
        run: |
          set -o pipefail
          make O=out $MAKE_ARGS -j"$(nproc)" Image dtbs 2>&1 | tee build.log

      - name: Package artifacts
        if: success()
        run: |
          set -eu
          mkdir -p dist
          cp out/arch/arm64/boot/Image dist/Image
          for f in dtbo.img dtb.img; do
            [ -f "out/arch/arm64/boot/$f" ] && cp "out/arch/arm64/boot/$f" dist/
          done
          cp out/.config dist/kernel.config
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-arm64-${{ inputs.config || 'vayu' }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
